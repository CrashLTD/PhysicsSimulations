<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Module Under Development — Physics Simulation Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- TOP NAVIGATION BAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5 text-left group focus:outline-none">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold shadow-sm group-hover:bg-blue-700 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 17c3.5-8 8.5-11 14-6m0 0h-4m4 0v4" />
          </svg>
        </div>
        <div>
          <span class="font-bold text-slate-900 tracking-tight text-base sm:text-lg block leading-none">Physics Simulation Lab</span>
          <span class="text-xs text-slate-500 font-medium">Interactive Browser Modules</span>
        </div>
      </a>

      <a href="index.html" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold transition">
        <span>← Back to Simulations</span>
      </a>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <div class="bg-white border border-slate-200 rounded-2xl p-8 sm:p-14 text-center max-w-xl mx-auto shadow-sm mt-6 space-y-5">
      <div class="w-14 h-14 rounded-2xl bg-slate-100 text-slate-600 flex items-center justify-center mx-auto">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
        </svg>
      </div>
      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Simulation Module Stub</span>
        <h1 id="stub-title" class="text-2xl font-bold text-slate-900 mt-1">Module Under Development</h1>
        <p class="text-sm text-slate-600 mt-2 leading-relaxed">
          This blank page is a placeholder route for future physics modules. Use the button below to return to the simulation directory.
        </p>
      </div>
      <div class="pt-2">
        <a href="index.html" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm shadow-sm transition">
          <span>← Back to Landing Page</span>
        </a>
      </div>
    </div>
  </main>

  <script>
    // Automatically displays the module name passed via ?title=... in the URL
    const params = new URLSearchParams(window.location.search);
    const title = params.get("title");
    if (title) {
      document.getElementById("stub-title").textContent = title;
      document.title = `${title} — Physics Simulation Lab`;
    }
  </script>
</body>
</html>
