<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Physics Simulation Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- TOP NAVIGATION BAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5 text-left group focus:outline-none">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold shadow-sm group-hover:bg-blue-700 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 17c3.5-8 8.5-11 14-6m0 0h-4m4 0v4" />
          </svg>
        </div>
        <div>
          <span class="font-bold text-slate-900 tracking-tight text-base sm:text-lg block leading-none">Physics Simulation Lab</span>
          <span class="text-xs text-slate-500 font-medium">Interactive Browser Modules</span>
        </div>
      </a>

      <a href="index.html" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold transition">
        <span>← Back to Landing Page</span>
      </a>
    </div>
  </header>

  <!-- MAIN LOGIN CARD -->
  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm space-y-6">
      <div class="text-center space-y-1.5">
        <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center mx-auto mb-3">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Lab Portal Login</h1>
        <p class="text-sm text-slate-500">Enter your account name and password to continue.</p>
      </div>

      <!-- Error Message Banner (Hidden by default) -->
      <div id="login-error" class="hidden rounded-xl bg-red-50 border border-red-200 px-4 py-3 text-sm font-medium text-red-700 flex items-center gap-2" role="alert">
        <svg class="w-4 h-4 shrink-0 text-red-600" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86l-7.5 13A1 1 0 003.65 18h16.7a1 1 0 00.86-1.5l-7.5-13a1 1 0 00-1.72 0z" />
        </svg>
        <span>username/password is incorrect</span>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4" novalidate>
        <div>
          <label for="account-name" class="block text-sm font-semibold text-slate-700 mb-1.5">Account Name</label>
          <input
            id="account-name"
            name="account-name"
            type="text"
            autocomplete="username"
            placeholder="e.g. TeacherDan"
            required
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition"
          />
        </div>

        <div>
          <label for="account-password" class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
          <input
            id="account-password"
            name="account-password"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition"
          />
        </div>

        <button
          type="submit"
          class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold text-sm shadow-sm transition"
        >
          Log In
        </button>
      </form>
    </div>
  </main>

  <!-- PYTHON-STYLE AUTHENTICATION LOGIC -->
  <script>
    /**
     * HARDCODED_ACCOUNTS
     * Dictionary mapping valid account names to their password and account_type ("teacher" or "student").
     */
    const HARDCODED_ACCOUNTS = {
      "TeacherDan": { password: "teacher", type: "teacher" },
      "Jasmin":     { password: "student", type: "student" },
      "Yaghnna":    { password: "student", type: "student" },
      "Kyla":       { password: "student", type: "student" },
      "Ellen":      { password: "student", type: "student" }
    };

    const STORAGE_KEY = "physics_lab_logged_in_user";
    const ROLE_STORAGE_KEY = "physics_lab_user_role";

    function verify_credentials(account_name, password) {
      if (Object.prototype.hasOwnProperty.call(HARDCODED_ACCOUNTS, account_name)) {
        const record = HARDCODED_ACCOUNTS[account_name];
        if (record.password === password) {
          return record;
        }
      }
      return null;
    }

    const login_form = document.getElementById("login-form");
    const error_banner = document.getElementById("login-error");
    const name_input = document.getElementById("account-name");
    const pass_input = document.getElementById("account-password");

    login_form.addEventListener("submit", (event) => {
      event.preventDefault();

      const entered_name = name_input.value.trim();
      const entered_password = pass_input.value;
      const account = verify_credentials(entered_name, entered_password);

      if (account) {
        // Save signed-in account name and account type, then return to landing page
        localStorage.setItem(STORAGE_KEY, entered_name);
        localStorage.setItem(ROLE_STORAGE_KEY, account.type);
        window.location.href = "index.html";
      } else {
        // Display error message when credentials do not match
        error_banner.classList.remove("hidden");
      }
    });

    // Hide error message as soon as user starts typing again
    [name_input, pass_input].forEach((input_el) => {
      input_el.addEventListener("input", () => {
        error_banner.classList.add("hidden");
      });
    });
  </script>
</body>
</html>
